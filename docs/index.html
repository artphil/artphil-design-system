<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Artphil Design System</title>

    <!-- Desenvolvimento -->
    <!-- <link rel="stylesheet" href="../index.css" /> -->

    <!-- Produção (comente o de cima) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/artphil-design-system/index.css"
    />

    <link rel="stylesheet" href="./doc.css" />
  </head>

  <body>
    <header>
      <h1 class="title">Artphil Design System</h1>
      <button onclick="toggleTheme()">Toggle Theme</button>
    </header>

    <main>
      <!-- ================= CORES ================= -->
      <div class="section">
        <h2 class="title">Cores</h2>
        <div class="box">
          <div class="grid" id="colors-grid">
            <div class="color-card">
              <div
                class="color-preview"
                style="background: var(--ap-color-primary)"
              ></div>
              <div class="color-info">
                <strong>Primary</strong><br />
                var(--ap-color-primary)
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= TIPOGRAFIA ================= -->
      <div class="section">
        <h2 class="title">Tipografia</h2>

        <div class="box">
          <h1>Heading 1</h1>
          <h2>Heading 2</h2>
          <p>Texto padrão do sistema</p>
          <small>Texto pequeno</small>
        </div>
      </div>

      <!-- ================= BOTÕES ================= -->
      <div class="section">
        <h2 class="title">Botões</h2>

        <div class="box">
          <div class="component-row">
            <button class="button">Default</button>
            <button class="button primary">Primary</button>
            <button class="button danger">Danger</button>
            <button class="button" disabled>Disabled</button>
          </div>
        </div>
      </div>

      <!-- ================= CARDS ================= -->
      <div class="section">
        <h2 class="title">Cards</h2>

        <div class="box">
          <div class="component-row">
            <div class="card" style="width: 200px">
              <h3>Título</h3>
              <p>Conteúdo do card</p>
            </div>

            <div class="card" style="width: 200px">
              <h3>Outro Card</h3>
              <p>Mais conteúdo</p>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= FORMULÁRIOS ================= -->
      <div class="section">
        <h2 class="title">Formulários</h2>

        <div class="box">
          <div class="component-row">
            <input type="text" placeholder="Input padrão" class="input" />
            <select class="input">
              <option>Opção 1</option>
              <option>Opção 2</option>
            </select>
            <textarea class="input" placeholder="Textarea"></textarea>
          </div>
        </div>
      </div>

      <!-- ================= UTILITÁRIOS ================= -->
      <div class="section">
        <h2 class="title">Utilitários</h2>

        <div class="box">
          <div class="component-row">
            <div class="box mt-md">.mt-md</div>
            <div class="box p-md">.p-md</div>
            <div class="box flex center" style="height: 80px">.flex.center</div>
          </div>
        </div>
      </div>
    </main>
    <footer>by Artphil</footer>
    <script src="./doc.js"></script>
  </body>
</html>
